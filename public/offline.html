<!doctype html>
<html lang="ko">
  <head>

    <title>연결이 잠시 끊겼어요</title>
    <style>
      :root { color-scheme: dark; font-family: Georgia, "Noto Serif KR", serif; }
      body { align-items: center; background: #0c3427; color: #fff4d8; display: flex; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; box-sizing: border-box; }

      a { background: linear-gradient(135deg, #e2c177, #b98b34); border-radius: 14px; color: #173b2f; display: inline-block; font-weight: 700; margin-top: 16px; padding: 14px 24px; text-decoration: none; }

  <body>
    <main>
      <p aria-hidden="true">✦ TAROT TARTE ✦</p>
